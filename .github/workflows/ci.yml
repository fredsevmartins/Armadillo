name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/armadillo-doc-tools --ignore-scripts --no-audit --no-fund mermaid@11.4.1 jsdom@26.1.0
      - run: node scripts/check_mermaid.mjs /tmp/armadillo-doc-tools/node_modules
  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install '.[tamandua]' ruff==0.14.3 jsonschema==4.26.0
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_docs.py
      - run: python scripts/check_contracts.py
      - run: python scripts/check_quickstart.py
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: armadillo-wheel-py${{ matrix.python }}
          path: dist/*.whl
      - run: |
          python -m venv /tmp/armadillo-wheel
          /tmp/armadillo-wheel/bin/pip install --no-index --no-deps dist/*.whl
          cd /tmp
          /tmp/armadillo-wheel/bin/armadillo schema report
          /tmp/armadillo-wheel/bin/armadillo audit "$GITHUB_WORKSPACE/examples/tamandua_integration/input.json" --format markdown
          /tmp/armadillo-wheel/bin/python "$GITHUB_WORKSPACE/scripts/check_quickstart.py"
  tamandua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Armadillo
      - uses: actions/checkout@v4
        with:
          repository: fredsevmartins/Tamandua
          ref: 09970fb8985e6065cc24ff5507a8de161c301ee9
          path: Tamandua
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo +1.90.0 test --locked --workspace -j 4
        working-directory: Tamandua
      - run: cargo +1.90.0 build --locked --bin tamandua -j 4
        working-directory: Tamandua
      - run: python -m pip install './Armadillo[tamandua]' jsonschema==4.26.0
      - run: python tests/real_tamandua.py -v
        working-directory: Armadillo
      - run: python scripts/check_contracts.py --tamandua ../Tamandua/target/debug/tamandua
        working-directory: Armadillo
      - run: python -m armadillo.cli doctor --tamandua-repo ../Tamandua
        working-directory: Armadillo
      - run: python scripts/check_quickstart.py --tamandua-repo ../Tamandua
        working-directory: Armadillo
