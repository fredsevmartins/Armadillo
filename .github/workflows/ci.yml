name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install . ruff==0.14.3
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_docs.py
      - run: python -m pip wheel --no-deps . --wheel-dir dist
  tamandua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Armadillo
      - uses: actions/checkout@v4
        with:
          repository: fredsevmartins/Tamandua
          ref: 09970fb8985e6065cc24ff5507a8de161c301ee9
          path: Tamandua
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo +1.90.0 test --locked --workspace -j 4
        working-directory: Tamandua
      - run: cargo +1.90.0 build --locked --bin tamandua -j 4
        working-directory: Tamandua
      - run: python -m pip install ./Armadillo
      - run: python tests/real_tamandua.py -v
        working-directory: Armadillo
