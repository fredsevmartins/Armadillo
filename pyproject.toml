[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "armadillo-evidence"
version = "0.1.0"
description = "Reproducible source-evidence audits with optional Tamandua RDF reasoning"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Armadillo contributors"}]
readme = "README.md"
dependencies = []

[project.scripts]
armadillo = "armadillo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
